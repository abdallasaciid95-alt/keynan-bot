services:
  - type: worker
    name: keynan-whatsapp-bot
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: WHATSAPP_SESSION_PATH
        value: /var/data/wwebjs-auth
    disk:
      name: whatsapp-session
      mountPath: /var/data
      sizeGB: 1
